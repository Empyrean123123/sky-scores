<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}</style>
<title>光遇琴谱练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：顶部导入栏 → 中央 3×5 琴键(光遇布局) → 底部走带控制；琴键上的光环收缩表示音符将到 */
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1d2433; --muted:#5d6679; --line:#d7dce8;
  --key:#f7f5ef; --key-edge:#cfd4e2; --glow:#e0a43a; --glow-soft:rgba(224,164,58,.28); --hit:#f3c25e;
  --accent:#3f5fa8; --accent-ink:#ffffff;
  --display:"Zen Maru Gothic","Noto Sans SC",system-ui,sans-serif;
  --body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101827; --panel:#172236; --ink:#e8ecf5; --muted:#9aa5bd; --line:#2a3852;
  --key:#1f2c45; --key-edge:#34466a; --glow:#f0b44c; --glow-soft:rgba(240,180,76,.25); --hit:#f6cf7a;
  --accent:#8fb0ff; --accent-ink:#0f1726; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101827; --panel:#172236; --ink:#e8ecf5; --muted:#9aa5bd; --line:#2a3852;
  --key:#1f2c45; --key-edge:#34466a; --glow:#f0b44c; --glow-soft:rgba(240,180,76,.25); --hit:#f6cf7a;
  --accent:#8fb0ff; --accent-ink:#0f1726; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 40px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.song{min-width:0}
.song .name{font-family:var(--display);font-size:1.15rem;font-weight:700;overflow-wrap:anywhere}
.song .meta{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.06em;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--panel)}
.drop.over{border-color:var(--glow);background:var(--glow-soft)}
.drop p{margin:0;color:var(--muted);font-size:.9rem;min-width:0}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--glow-soft);border-color:var(--glow)}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,2.2vw,16px);width:100%;max-width:520px}
.key{position:relative;aspect-ratio:1;max-width:100%;border-radius:22%;background:var(--key);border:1.5px solid var(--key-edge);display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .12s}
.key svg{width:44%;height:44%;opacity:.55}
.key .lbl{position:absolute;bottom:6%;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.key .ring{position:absolute;inset:-2px;border-radius:24%;border:3px solid var(--glow);opacity:0;pointer-events:none}
.key.on{background:var(--hit)}
.key.on svg{opacity:1}
.key.want{box-shadow:0 0 0 3px var(--glow) inset}
.hint{color:var(--muted);font-size:.82rem;text-align:center;margin:0}
.transport{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;min-width:92px}
input[type=range]{accent-color:var(--glow);flex:1;min-width:120px}
.seek{width:100%}
label.inline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem;flex:1;min-width:200px}
.loopinfo{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.err{color:#c0392b;font-size:.88rem;margin:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#ff8a7a}}
:root[data-theme="dark"] .err{color:#ff8a7a}
@media (prefers-reduced-motion: reduce){.key{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>光遇琴谱练习</h1>
    <div class="song" aria-live="polite">
      <div class="name" id="songName">欢乐颂<span class="tag">示例</span></div>
      <div class="meta" id="songMeta">贝多芬 · 0 音 · 0:00</div>
    </div>
  </header>

  <div class="drop" id="drop">
    <p>把做好的琴谱 <b>.txt</b> 拖到这里，或点右边的按钮选择文件。只在你的浏览器里读取，不会上传。</p>
    <label class="btn" for="file">打开琴谱<input type="file" id="file" accept=".txt,.json,text/plain,application/json"></label>
  </div>
  <p class="err" id="err" hidden></p>

  <section class="stage" aria-label="琴键">
    <div class="keys" id="keys"></div>
    <p class="hint">光环收缩到琴键边缘时按下。电脑键盘：Y U I O P / H J K L ; / N M , . /</p>
  </section>

  <section class="transport" aria-label="播放控制">
    <div class="row">
      <button class="primary" id="play">▶ 播放</button>
      <button id="restart">⟲ 从头</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="进度">
    <div class="row">
      <label class="inline" for="speed">速度 <input type="range" id="speed" min="25" max="150" step="5" value="100"> <span id="speedV" class="time" style="min-width:3em">100%</span></label>
    </div>
    <div class="row">
      <button id="wait" aria-pressed="false">等待模式</button>
      <button id="melody" aria-pressed="false">只看主旋律</button>
      <button id="sound" aria-pressed="true">声音开</button>
    </div>
    <div class="row">
      <button id="setA">设 A 点</button>
      <button id="setB">设 B 点</button>
      <button id="clearAB">取消循环</button>
      <span class="loopinfo" id="loopInfo">未设置循环</span>
    </div>
    <p class="hint" style="text-align:left">等待模式：播到每个音都会停下，等你按对了才继续，适合一句一句练。只看主旋律：每个时刻只保留最高的那个键，大致就是主唱旋律。</p>
  </section>
</div>

<script>
(()=>{
const PCKEYS=['y','u','i','o','p','h','j','k','l',';','n','m',',','.','/'];
const SCALE=[0,2,4,5,7,9,11];
const freq=(k,shift)=>{const semi=12*Math.floor(k/7)+SCALE[k%7]+shift;return 261.6256*Math.pow(2,semi/12)};
// 光遇琴键图案：每个八度的 do 是圆中菱形，其余交替圆/菱形
const ICON=k=>{const d=k%7===0;const c=k%2===0;
  if(d)return '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3"><circle cx="20" cy="20" r="16"/><path d="M20 9l11 11-11 11L9 20z" fill="currentColor"/></svg>';
  return c?'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3"><circle cx="20" cy="20" r="15"/></svg>'
          :'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 5l15 15-15 15L5 20z"/></svg>'};
const $=id=>document.getElementById(id);
const keysEl=$('keys'); const keyEls=[];
for(let k=0;k<15;k++){const b=document.createElement('div');b.className='key';b.setAttribute('role','button');b.setAttribute('aria-label','第'+(k+1)+'键');
  b.innerHTML=ICON(k)+'<span class="ring"></span><span class="lbl">'+PCKEYS[k].toUpperCase()+'</span>';
  b.addEventListener('pointerdown',e=>{e.preventDefault();press(k)});keysEl.appendChild(b);keyEls.push(b)}

// 示例：欢乐颂（公有领域），旋律在高八度，低音每小节一个根音
function sample(){const q=500;
  // [键, 拍数]；每小节 4 拍，小节首拍配一个低音根音
  const bar=(ks,bass)=>({ks,bass});
  const bars=[bar([[9,1],[9,1],[10,1],[11,1]],0),bar([[11,1],[10,1],[9,1],[8,1]],4),bar([[7,1],[7,1],[8,1],[9,1]],0),bar([[9,1.5],[8,.5],[8,2]],4),
              bar([[9,1],[9,1],[10,1],[11,1]],0),bar([[11,1],[10,1],[9,1],[8,1]],4),bar([[7,1],[7,1],[8,1],[9,1]],0),bar([[8,1.5],[7,.5],[7,2]],0)];
  const n=[];let t=0;
  for(const b of bars){n.push({time:t,key:b.bass});for(const [k,len] of b.ks){n.push({time:t,key:k});t+=len*q}}
  return {name:'欢乐颂',author:'贝多芬',pitchLevel:0,notes:n}}

let song=sample(), groups=[], shown=[];
let ctx=null, playing=false, pos=0, lastTs=0, speed=1, waitMode=false, melodyOnly=false, soundOn=true, A=null, B=null, nextIdx=0, pressedSet=new Set();
const LOOK=900;

function build(){
  const by=new Map();for(const n of song.notes){if(!by.has(n.time))by.set(n.time,new Set());by.get(n.time).add(n.key)}
  groups=[...by.entries()].sort((a,b)=>a[0]-b[0]).map(([t,s])=>({t,keys:[...s].sort((a,b)=>a-b)}));
  shown=groups.map(g=>({t:g.t,keys:melodyOnly?[g.keys[g.keys.length-1]]:g.keys}));
  const dur=groups.length?groups[groups.length-1].t:0;
  $('songMeta').textContent=(song.author?song.author+' · ':'')+song.notes.length+' 音 · '+fmt(dur);
  $('seek').max=Math.max(1,Math.round(dur));
}
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const dur=()=>groups.length?groups[groups.length-1].t:0;
function seekTo(ms){pos=Math.max(0,Math.min(ms,dur()));nextIdx=shown.findIndex(g=>g.t>=pos-1);if(nextIdx<0)nextIdx=shown.length;pressedSet.clear();paint()}

function audio(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)ctx=new AC()}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function tone(k,vol=0.22){if(!soundOn||!audio())return;const f=freq(k,song.pitchLevel||0),t=ctx.currentTime;
  const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);g.connect(ctx.destination);
  [[1,'triangle',1],[2,'sine',0.35],[3,'sine',0.12]].forEach(([m,type,a])=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type=type;o.frequency.value=f*m;og.gain.value=a;o.connect(og).connect(g);o.start(t);o.stop(t+1.7)})}
function flash(k){const el=keyEls[k];el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),160)}

function press(k){tone(k);flash(k);
  if(waitMode&&playing&&nextIdx<shown.length&&shown[nextIdx].t<=pos+1&&shown[nextIdx].keys.includes(k)){pressedSet.add(k);
    if(shown[nextIdx].keys.every(x=>pressedSet.has(x))){pressedSet.clear();nextIdx++}}}

function tick(ts){
  if(!playing)return;
  const dt=lastTs?Math.min(100,ts-lastTs):0;lastTs=ts;
  let np=pos+dt*speed;
  if(waitMode&&nextIdx<shown.length&&np>shown[nextIdx].t)np=shown[nextIdx].t;
  if(!waitMode){while(nextIdx<shown.length&&shown[nextIdx].t<=np){shown[nextIdx].keys.forEach(k=>{tone(k,0.18);flash(k)});nextIdx++}}
  pos=np;
  if(A!==null&&B!==null&&pos>=B)seekTo(A);
  else if(pos>=dur()&&nextIdx>=shown.length){stop();seekTo(0)}
  paint();requestAnimationFrame(tick);
}
function paint(){
  const ahead=new Map();
  for(let i=nextIdx;i<shown.length&&shown[i].t-pos<LOOK;i++)for(const k of shown[i].keys)if(!ahead.has(k))ahead.set(k,shown[i].t-pos);
  keyEls.forEach((el,k)=>{const r=el.children[1];const d=ahead.get(k);
    if(d===undefined){r.style.opacity=0;el.classList.remove('want')}
    else{const p=Math.max(0,d)/LOOK;r.style.opacity=(1-p*0.8).toFixed(2);r.style.transform='scale('+(1+p*0.55).toFixed(3)+')';el.classList.toggle('want',waitMode&&d<=1)}});
  $('time').textContent=fmt(pos)+' / '+fmt(dur());
  if(document.activeElement!==$('seek'))$('seek').value=Math.round(pos);
}
function start(){if(!groups.length)return;audio();playing=true;lastTs=0;$('play').textContent='❚❚ 暂停';requestAnimationFrame(tick)}
function stop(){playing=false;$('play').textContent='▶ 播放'}

$('play').onclick=()=>playing?stop():start();
$('restart').onclick=()=>{seekTo(A??0);if(!playing)start()};
$('seek').oninput=e=>seekTo(+e.target.value);
$('speed').oninput=e=>{speed=e.target.value/100;$('speedV').textContent=e.target.value+'%'};
const toggle=(id,fn)=>{const b=$(id);b.onclick=()=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v);fn(v)}};
toggle('wait',v=>{waitMode=v;pressedSet.clear()});
toggle('melody',v=>{melodyOnly=v;build();seekTo(pos)});
toggle('sound',v=>{soundOn=v;$('sound').textContent=v?'声音开':'声音关'});
const showLoop=()=>{$('loopInfo').textContent=A===null&&B===null?'未设置循环':'循环 '+(A===null?'—':fmt(A))+' → '+(B===null?'—':fmt(B))};
$('setA').onclick=()=>{A=pos;if(B!==null&&B<=A)B=null;showLoop()};
$('setB').onclick=()=>{if(A!==null&&pos>A){B=pos;showLoop()}};
$('clearAB').onclick=()=>{A=B=null;showLoop()};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();playing?stop():start();return}
  const k=PCKEYS.indexOf(e.key.toLowerCase());if(k>=0&&!e.repeat&&!e.metaKey&&!e.ctrlKey){e.preventDefault();press(k)}});

function load(buf,fname){
  const err=$('err');err.hidden=true;
  try{const u=new Uint8Array(buf);let txt;
    if(u[0]===0xFF&&u[1]===0xFE)txt=new TextDecoder('utf-16le').decode(u.subarray(2));
    else if(u[0]===0xFE&&u[1]===0xFF)txt=new TextDecoder('utf-16be').decode(u.subarray(2));
    else txt=new TextDecoder('utf-8').decode(u).replace(/^﻿/,'');
    let d=JSON.parse(txt);if(Array.isArray(d))d=d[0];
    const raw=d.songNotes||d.notes;if(!Array.isArray(raw)||!raw.length)throw new Error('没有找到 songNotes');
    const notes=[];for(const n of raw){const m=String(n.key).match(/(\d+)$/);if(m&&+m[1]<15)notes.push({time:+n.time,key:+m[1]})}
    if(!notes.length)throw new Error('音符的键位读不出来');
    const t0=Math.min(...notes.map(n=>n.time));notes.forEach(n=>n.time-=t0);
    song={name:d.name||fname.replace(/\.[^.]+$/,''),author:d.author||'',pitchLevel:+d.pitchLevel||0,notes};
    $('songName').textContent=song.name;stop();A=B=null;showLoop();build();seekTo(0);
  }catch(ex){err.textContent='这个文件读不出来（'+ex.message+'）。请选择光遇弹谱器格式的 .txt 琴谱。';err.hidden=false}
}
$('file').onchange=e=>{const f=e.target.files[0];if(f)f.arrayBuffer().then(b=>load(b,f.name));e.target.value=''};
const drop=$('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)f.arrayBuffer().then(b=>load(b,f.name))});
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());

build();seekTo(0);showLoop();
})();
</script>

</body>
</html>
